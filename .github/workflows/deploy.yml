name: Deploy to Pages

# 어느 브랜치를 밀어도 배포한다. Pages 는 저장소당 사이트가 하나뿐이라
# 브랜치 빌드가 라이브를 덮어쓴다 - 폰에서 미리 보려고 일부러 그렇게 둔다.
# HUD 버전에 브랜치 이름이 찍히므로 무엇을 보고 있는지는 구분된다.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 살린다. 진행 중인 배포는 끊지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # export template 은 1.2GB 다. 버전이 그대로면 받지 않는다.
      - name: Cache export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Install Godot
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          install -m 755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Install export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          # Web 프리셋만 쓰므로 web_*.zip 과 version.txt 만 푼다. 1.2GB 대신 84MB.
          unzip -q -o -j templates.tpz 'templates/web_*.zip' 'templates/version.txt' -d "$dest"

      # run_tests.sh 가 먼저 --import 를 돌린다. 첫 실행에 .godot/ 가 없어도 된다.
      # GODOT 은 반드시 절대 경로여야 한다 — 스크립트가 -x 로 검사한다.
      - name: Run tests
        run: ./run_tests.sh
        env:
          GODOT: /usr/local/bin/godot

      # 빌드마다 날짜와 커밋 해시를 박는다. HUD 에 그대로 뜨므로 폰에서
      # 지금 보고 있는 것이 새 빌드인지 캐시된 옛 빌드인지 눈으로 구별된다.
      - name: Stamp version
        run: |
          set -euo pipefail
          # 브랜치 이름도 박는다. 브랜치 빌드가 라이브를 덮어쓰므로, 지금
          # 화면에 뜬 것이 main 인지 작업 중인 브랜치인지 눈으로 구별해야 한다.
          slug=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9' '-' | cut -c1-24)
          echo "VERSION=$(date -u +%Y-%m-%d) $slug ${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "BASENAME=3dblockbreaker-$(date -u +%Y%m%d)-$slug-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Export Web build
        run: |
          set -euo pipefail
          # 따옴표 친 heredoc 이라 셸이 본문을 건드리지 않는다. 정규식의 $ 가
          # 변수로 오해받지 않도록 값은 환경변수로 넘긴다.
          python3 - <<'PY'
          import os, re
          p = 'project.godot'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'^config/version=.*$',
              'config/version="%s"' % os.environ['VERSION'], s, flags=re.M)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep '^config/version=' project.godot
          mkdir -p build/web
          # 파일 이름에 버전을 넣는다. wasm 은 39MB 라 브라우저가 오래 붙잡고
          # 있는데, URL 자체가 바뀌면 캐시가 끼어들 여지가 없다.
          godot --headless --export-release "Web" "build/web/$BASENAME.html"
          printf '%s' "$BASENAME" > build/web/version.txt
          # 고정 주소는 index.html 하나뿐이라 브라우저가 이것만 오래 붙잡는다.
          # 여기에 빌드 이름을 박으면, 다음 배포로 그 파일들이 사라진 뒤에도
          # 캐시된 옛 index.html 이 없는 주소를 부르며 아무것도 안 뜬다.
          # 그래서 이 파일에는 이름을 박지 않고, 열릴 때마다 서버에서 어떤
          # 빌드인지 새로 읽는다.
          #
          # 읽은 빌드로 넘어갈 때 주소를 바꾸지 않고 iframe 안에 띄운다.
          # 주소를 바꾸면 폰에서 "홈 화면에 추가" 한 아이콘이 그때의 빌드
          # 주소를 기억하는데, 다음 배포로 그 파일이 사라져 404 만 뜬다.
          cat > build/web/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="ko">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <meta name="apple-mobile-web-app-title" content="3DBlockBreaker">
          <title>3DBlockBreaker</title>
          <style>
          /* iframe 이 화면을 꽉 채우려면 html 과 body 가 둘 다 크기를 가져야 한다.
             둘 중 하나라도 내용에 맞춰 줄어들면 iframe 의 100% 가 잴 것을 잃고
             기본 크기(300x150)로 주저앉아 게임이 화면 한구석에만 그려진다. */
          html, body { margin: 0; width: 100%; height: 100%; overflow: hidden;
            background: #0d0f17; }
          iframe { border: 0; width: 100%; height: 100%; display: block; }
          #msg { color: #8a8fa3; font: 16px -apple-system, sans-serif; padding: 24px; }
          </style>
          </head>
          <body><div id="msg">불러오는 중…</div>
          <script>
          fetch("version.txt?t=" + Date.now(), { cache: "no-store" })
            .then(function (r) { return r.text(); })
            .then(function (v) {
              var f = document.createElement("iframe");
              f.src = v.trim() + ".html";
              f.allow = "autoplay; fullscreen; gamepad";
              document.body.textContent = "";
              document.body.appendChild(f);
            })
            .catch(function () {
              document.getElementById("msg").textContent = "불러오지 못했다. 새로고침.";
            });
          </script>
          </body>
          </html>
          HTML
          # Pages 의 Jekyll 처리를 끈다 — 밑줄로 시작하는 파일이 생겨도 안전하다.
          touch build/web/.nojekyll
          test -s "build/web/$BASENAME.wasm"
          test -s "build/web/$BASENAME.html"
          # index.html 에 빌드 이름이 들어가면 다음 배포 때 다시 깨진다.
          grep -q 'version.txt' build/web/index.html
          ! grep -q "$BASENAME" build/web/index.html
          # 주소가 고정이어야 홈 화면 아이콘이 다음 배포에도 살아 있다.
          grep -q 'createElement("iframe")' build/web/index.html
          test "$(cat build/web/version.txt)" = "$BASENAME"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
