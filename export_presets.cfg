[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
; 스레드를 켜면 SharedArrayBuffer 가 필요하고, 그건 COOP/COEP 응답 헤더를 요구한다.
; GitHub Pages 는 응답 헤더를 바꿀 수 없으므로 켜면 흰 화면만 뜬다.
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
; application/config/icon 을 파비콘과 홈 화면 아이콘으로 내보낸다.
html/export_icon=true
html/custom_html_shell=""
; iOS 사파리에서 "홈 화면에 추가" 했을 때 주소창 없이 전체화면으로 뜨게 한다.
html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=1
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0.05, 0.06, 0.09, 1)
[preset.1]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/android/blockbreaker.aab"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
; AAB(앱 번들)를 만들려면 필요하다. Play Console 이 APK 를 더 이상 받지 않는다.
gradle_build/use_gradle_build=true
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=1
gradle_build/min_sdk="24"
; 2026-08-31 부터 Play 가 target SDK 36(안드로이드 16) 미만 업데이트를 막는다.
gradle_build/target_sdk="36"
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="1.0.0"
; 패키지 이름은 업로드하는 순간 영구히 고정된다 — 나중에 못 바꾼다.
package/unique_name="com.jwkiim.blockbreaker"
package/name="3D 블럭파괴"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
launcher_icons/main_192x192="res://assets/android/icon_192.png"
launcher_icons/adaptive_foreground_432x432="res://assets/android/icon_foreground_432.png"
launcher_icons/adaptive_background_432x432="res://assets/android/icon_background_432.png"
graphics/opengl_debug=false
xr_features/xr_mode=0
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
command_line/extra_args=""
apk_expansion/enable=false
permissions/custom_permissions=PackedStringArray()
; 광고 요청은 네트워크를 쓴다. AdMob SDK 가 요구.
permissions/internet=true
; 아래 keystore 값은 CI 가 빌드 직전에만 비밀값으로 채워 넣는다 — 커밋에는
; 절대 실제 값이 들어가면 안 된다. 이 저장소는 public 이다.
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release=""
keystore/release_user=""
keystore/release_password=""
one_click_deploy/clear_previous_install=false
